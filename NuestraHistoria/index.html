<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Historia ♡</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <section id="inicio" class="pantalla-inicio">
        <div class="estrellas"></div>

        <div class="entrada">
            <div class="texto-superior">
                Nuestra historia
            </div>

            <!-- Al hacer clic en el frasco se redirige a historia.html -->
            <a href="historia.html" class="frasco-enlace">
                <div class="frasco-contenedor">
                    <!-- Brillos -->
                    <div class="brillo brillo-1"></div>
                    <div class="brillo brillo-2"></div>
                    <div class="brillo brillo-3"></div>

                    <!-- Frasco -->
                    <div class="frasco">
                        <div class="cuello-frasco"></div>
                        <div class="tapa-frasco"></div>
                        <div class="cristal">
                            <div class="agua"></div>
                            
                            <!-- Piedras -->
                            <div class="piedra piedra-1"></div>
                            <div class="piedra piedra-2"></div>
                            <div class="piedra piedra-3"></div>
                            <div class="piedra piedra-4"></div>

                            <!-- Rosa -->
                            <div class="tallo tallo-rosa">
                                <div class="hoja hoja-rosa-1"></div>
                                <div class="hoja hoja-rosa-2"></div>
                            </div>
                            <div class="rosa">
                                <div class="petalo petalo-1"></div>
                                <div class="petalo petalo-2"></div>
                                <div class="petalo petalo-3"></div>
                                <div class="petalo petalo-4"></div>
                                <div class="petalo petalo-5"></div>
                                <div class="petalo petalo-6"></div>
                                <div class="centro-rosa"></div>
                            </div>

                            <!-- Tulipán -->
                            <div class="tallo tallo-tulipan">
                                <div class="hoja hoja-tulipan-1"></div>
                                <div class="hoja hoja-tulipan-2"></div>
                            </div>
                            <div class="tulipan">
                                <div class="petalo-tulipan pt-1"></div>
                                <div class="petalo-tulipan pt-2"></div>
                                <div class="petalo-tulipan pt-3"></div>
                                <div class="petalo-tulipan pt-4"></div>
                                <div class="petalo-tulipan pt-5"></div>
                            </div>
                        </div>
                        <div class="reflejo"></div>
                    </div>
                    <div class="sombra-frasco"></div>
                </div>
            </a>

            <p class="instruccion">
                Haz clic sobre el frasco
            </p>

            <div class="corazon-pulsante">
                ♡
            </div>
        </div>
    </section>

    <script src="js/script.js"></script>
</body>
</html>
